name: Build and Test

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore Microservices/Catalog/Catalog.slnx
        dotnet restore Microservices/Identity/Identity.slnx
        dotnet restore Microservices/Basket/Basket.slnx
        dotnet restore Microservices/Ordering/Ordering.slnx

    - name: Build
      run: |
        dotnet build Microservices/Catalog/Catalog.slnx --no-restore -c Release
        dotnet build Microservices/Identity/Identity.slnx --no-restore -c Release
        dotnet build Microservices/Basket/Basket.slnx --no-restore -c Release
        dotnet build Microservices/Ordering/Ordering.slnx --no-restore -c Release

    - name: Run tests
      run: |
        dotnet test Microservices/Catalog/Catalog.Domain.Tests/Catalog.Domain.Tests.csproj --no-build -c Release --verbosity normal
        dotnet test Microservices/Identity/Identity.Domain.Tests/Identity.Domain.Tests.csproj --no-build -c Release --verbosity normal
        dotnet test Microservices/Basket/Basket.Domain.Tests/Basket.Domain.Tests.csproj --no-build -c Release --verbosity normal
        dotnet test Microservices/Ordering/Ordering.Domain.Tests/Ordering.Domain.Tests.csproj --no-build -c Release --verbosity normal