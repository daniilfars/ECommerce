global:
  scrape_interval: 15s

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ['catalog-api:1234']
  - job_name: identity
    static_configs:
      - targets: ['identity-api:1234']
  - job_name: basket
    static_configs:
      - targets: ['basket-api:1234']
  - job_name: ordering
    static_configs:
      - targets: ['ordering-api:1234']